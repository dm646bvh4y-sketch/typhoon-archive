name: Archive JMA typhoon forecasts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and archive JMA forecast snapshots
        run: python scripts/archive_forecasts.py
      - name: Archive timestamped typhoon analysis positions
        run: python scripts/archive_best_tracks.py
      - name: Commit archive updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/archive
          if ! git diff --cached --quiet; then
            git commit -m "Archive JMA typhoon forecast snapshots"
            git push
          else
            echo "No archive changes."
          fi
